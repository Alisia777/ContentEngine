<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0f14" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <!-- Витрина согласования: лёгкая клиентская страница БЕЗ SPA-бутстрапа.
         Токен живёт в hash-фрагменте (#t=...) и не попадает ни в логи
         хостинга, ни в referrer. Скрипт только внешний (script-src 'self'). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src https://*.supabase.co blob:; connect-src https://*.supabase.co"
    />
    <title>Согласование роликов</title>
    <style>
      :root {
        --ground: #0d0f14;
        --card: #161a22;
        --line: #2a3040;
        --ink: #eceef2;
        --muted: #9aa2b1;
        --accent: #e8b34b;
        --ok: #57b87c;
        --warn: #e07a5f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font: 16px/1.5 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 560px; margin: 0 auto; padding: 20px 14px 60px; }
      header h1 { font-size: 1.25rem; margin: 0 0 2px; }
      header p { margin: 0; color: var(--muted); font-size: .85rem; }
      .state { text-align: center; padding: 60px 20px; color: var(--muted); }
      .state strong { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 6px; }
      .card {
        background: var(--card); border: 1px solid var(--line);
        border-radius: 12px; margin-top: 16px; overflow: hidden;
      }
      .card video { display: block; width: 100%; background: #000; aspect-ratio: 9 / 16; max-height: 70vh; }
      .card .body { padding: 12px 14px 14px; }
      .card h2 { font-size: .95rem; margin: 0 0 2px; word-break: break-word; }
      .card .meta { color: var(--muted); font-size: .78rem; margin: 0 0 10px; }
      .status {
        display: inline-block; border-radius: 6px; padding: 2px 9px;
        font-size: .78rem; font-weight: 600; margin-bottom: 10px;
      }
      .status.accepted { background: rgba(87, 184, 124, .15); color: var(--ok); }
      .status.returned { background: rgba(224, 122, 95, .15); color: var(--warn); }
      .status.publish_requested { background: rgba(232, 179, 75, .15); color: var(--accent); }
      .status.published { background: rgba(87, 184, 124, .25); color: var(--ok); }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      button {
        font: inherit; border-radius: 10px; border: 1px solid var(--line);
        background: #1d2330; color: var(--ink); padding: 10px 14px;
        cursor: pointer; flex: 1; min-width: 110px;
      }
      button.primary { background: var(--ok); border-color: var(--ok); color: #08120c; font-weight: 600; }
      button.ghost { background: transparent; }
      button.accent { background: var(--accent); border-color: var(--accent); color: #171204; font-weight: 600; flex-basis: 100%; }
      .all-done {
        border: 1px solid var(--ok); border-radius: 12px; margin-top: 16px;
        padding: 12px 14px; font-size: .85rem; color: var(--ok);
        background: rgba(87, 184, 124, .08);
      }
      button:disabled { opacity: .5; cursor: default; }
      textarea {
        width: 100%; font: inherit; border-radius: 10px; margin-top: 10px;
        border: 1px solid var(--line); background: #10141c; color: var(--ink);
        padding: 10px 12px; min-height: 84px; resize: vertical;
      }
      .return-box { display: none; }
      .return-box.open { display: block; }
      .note { color: var(--muted); font-size: .78rem; margin: 8px 0 0; }
      .toast {
        position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
        background: #222938; border: 1px solid var(--line); color: var(--ink);
        padding: 10px 16px; border-radius: 10px; font-size: .85rem;
        max-width: 90vw; display: none;
      }
      .toast.show { display: block; }
      footer { margin-top: 28px; text-align: center; color: var(--muted); font-size: .75rem; }
      .tabs { display: flex; gap: 8px; margin-top: 14px; }
      .tabs button { flex: 1; }
      .tabs button.active { background: var(--accent); border-color: var(--accent); color: #171204; font-weight: 600; }
      .intake-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-top: 16px; padding: 14px; }
      .intake-card h2 { font-size: .95rem; margin: 0 0 8px; }
      .intake-card label { display: block; margin-top: 10px; font-size: .82rem; color: var(--muted); }
      .intake-card input[type="text"], .intake-card textarea {
        width: 100%; font: inherit; border-radius: 10px; margin-top: 4px;
        border: 1px solid var(--line); background: #10141c; color: var(--ink);
        padding: 9px 11px;
      }
      .intake-card textarea { min-height: 64px; resize: vertical; }
      .option-line { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; font-size: .82rem; color: var(--muted); }
      .option-line input { margin-top: 3px; }
      .file-row { display: flex; justify-content: space-between; gap: 8px; font-size: .8rem; margin-top: 6px; color: var(--muted); }
      .file-row .ok { color: var(--ok); }
      .file-row .err { color: var(--warn); }
      .brief-status { border-left: 3px solid var(--line); padding: 6px 10px; margin-top: 8px; font-size: .82rem; }
      .brief-status.accepted { border-color: var(--ok); }
      .brief-status.returned { border-color: var(--warn); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header id="review-header" hidden>
        <h1 id="review-title">Согласование роликов</h1>
        <p id="review-subtitle"></p>
      </header>
      <div id="review-state" class="state"><strong>Загружаем ролики…</strong>Это займёт пару секунд.</div>
      <div class="tabs" id="review-tabs" hidden>
        <button type="button" id="tab-videos" class="active">Ролики</button>
        <button type="button" id="tab-intake">Материалы и бриф</button>
      </div>
      <div id="review-list"></div>
      <div id="intake-panel" hidden></div>
      <footer id="review-footer" hidden>
        Ссылки на видео действуют 15 минут — если ролик перестал играть,
        просто обновите страницу.
      </footer>
    </div>
    <div class="toast" id="review-toast" role="status"></div>
    <script src="./config.js?v=20260826.rebuild-clean.60"></script>
    <script src="./review.js?v=20260826.rebuild-clean.60"></script>
  </body>
</html>
