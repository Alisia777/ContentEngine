name: Issue-triggered ContentEngine keyword demand research

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: contentengine-keyword-demand-issue-20260811
  cancel-in-progress: true

jobs:
  research:
    if: github.event.issue.title == '[research] ContentEngine keyword demand 2026-08-11'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPORT_BRANCH: research/contentengine-keyword-demand-20260811
    steps:
      - name: Publish start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "keyword-demand-started run-id=${{ github.run_id }}"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect demand
        run: python scripts/one_off_keyword_demand_20260811.py

      - name: Publish report branch
        shell: bash
        run: |
          git config user.name "ContentEngine Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git push origin --delete "$REPORT_BRANCH" >/dev/null 2>&1 || true
          git switch -c "$REPORT_BRANCH"
          git add docs/research/contentengine_keyword_demand_2026-08-11.md \
                  docs/research/contentengine_keyword_demand_2026-08-11.csv \
                  docs/research/contentengine_keyword_demand_raw_2026-08-11.json
          git commit -m "Add ContentEngine keyword-demand research 2026-08-11"
          git push -u origin "$REPORT_BRANCH"

      - name: Publish completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "keyword-demand-completed run-id=${{ github.run_id }} branch=$REPORT_BRANCH"

      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "keyword-demand-failed run-id=${{ github.run_id }}"
