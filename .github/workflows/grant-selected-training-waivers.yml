name: Grant selected workspace waivers

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Grant workspace access to guest, klimov and artiukhins
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-selected-training-waivers
  cancel-in-progress: false

jobs:
  grant:
    name: Grant the fixed reviewed account set
    if: github.ref == 'refs/heads/main' && inputs.confirm == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      EXPECTED_SUPABASE_PROJECT_REF: iyckwryrucqrxwlowxow
    steps:
      - name: Check out reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Validate protected production binding
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_OWNER_EMAIL: ${{ secrets.SUPABASE_OWNER_EMAIL }}
          SUPABASE_MEMBER_GUEST_EMAIL: ${{ secrets.SUPABASE_MEMBER_GUEST_EMAIL }}
          SUPABASE_MEMBER_KLIMOV_EMAIL: ${{ secrets.SUPABASE_MEMBER_KLIMOV_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?Configure SUPABASE_ACCESS_TOKEN in production}"
          : "${SUPABASE_PROJECT_REF:?Configure SUPABASE_PROJECT_REF as a repository variable}"
          : "${SUPABASE_OWNER_EMAIL:?Configure SUPABASE_OWNER_EMAIL in production}"
          : "${SUPABASE_MEMBER_GUEST_EMAIL:?Configure SUPABASE_MEMBER_GUEST_EMAIL in production}"
          : "${SUPABASE_MEMBER_KLIMOV_EMAIL:?Configure SUPABASE_MEMBER_KLIMOV_EMAIL in production}"
          if [ "$SUPABASE_PROJECT_REF" != "$EXPECTED_SUPABASE_PROJECT_REF" ]; then
            echo "Production project binding mismatch" >&2
            exit 1
          fi
          if [ "$SUPABASE_OWNER_EMAIL" = "$SUPABASE_MEMBER_GUEST_EMAIL" ] \
             || [ "$SUPABASE_OWNER_EMAIL" = "$SUPABASE_MEMBER_KLIMOV_EMAIL" ] \
             || [ "$SUPABASE_MEMBER_GUEST_EMAIL" = "$SUPABASE_MEMBER_KLIMOV_EMAIL" ]; then
            echo "Selected account slots must be distinct" >&2
            exit 1
          fi
          echo "::add-mask::$SUPABASE_OWNER_EMAIL"
          echo "::add-mask::$SUPABASE_MEMBER_GUEST_EMAIL"
          echo "::add-mask::$SUPABASE_MEMBER_KLIMOV_EMAIL"

      - name: Grant all three waivers atomically
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_OWNER_EMAIL: ${{ secrets.SUPABASE_OWNER_EMAIL }}
          SUPABASE_MEMBER_GUEST_EMAIL: ${{ secrets.SUPABASE_MEMBER_GUEST_EMAIL }}
          SUPABASE_MEMBER_KLIMOV_EMAIL: ${{ secrets.SUPABASE_MEMBER_KLIMOV_EMAIL }}
        shell: bash
        run: python -m scripts.grant_selected_training_access_waivers

      - name: Publish non-sensitive operation summary
        if: success()
        shell: bash
        run: |
          {
            echo "### Selected workspace access"
            echo
            echo "- guest: operator + active waiver"
            echo "- klimov: operator + active waiver"
            echo "- artiukhins: owner preserved + active waiver"
            echo "- transaction: complete"
          } >> "$GITHUB_STEP_SUMMARY"
