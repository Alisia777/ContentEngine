name: Temporary patch Reference Intelligence lint

on:
  push:
    branches:
      - agent/reference-intelligence-v1

permissions:
  contents: write

concurrency:
  group: temporary-reference-lint-patch
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: agent/reference-intelligence-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Mark intentional control-byte validation for Deno lint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("supabase/functions/creator-reference-intelligence/index.ts")
          text = path.read_text(encoding="utf-8")
          marker = "// deno-lint-ignore-file no-control-regex\n"
          if marker not in text:
              first_line, rest = text.split("\n", 1)
              text = f"{first_line}\n{marker}{rest}"
              path.write_text(text, encoding="utf-8")
          PY
          if git diff --quiet -- supabase/functions/creator-reference-intelligence/index.ts; then
            echo "Lint intent is already documented"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/creator-reference-intelligence/index.ts
          git commit -m "Document intentional control-byte validation"
          git push origin HEAD:agent/reference-intelligence-v1
