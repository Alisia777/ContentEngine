name: Export PR206 source tree

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.event.pull_request.number == 206 &&
      github.event.pull_request.head.ref == 'agent/finalize-mp4-first-generation-v4'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Build source archive
        run: |
          git archive --format=tar.gz --output=/tmp/contentengine-pr206.tar.gz HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contentengine-pr206-tree
          path: /tmp/contentengine-pr206.tar.gz
          if-no-files-found: error
          retention-days: 1
