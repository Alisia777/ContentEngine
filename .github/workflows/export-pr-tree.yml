name: Export PR tree

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.number == 205
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build source archive
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/contentengine-pr205.tar.gz HEAD
          sha256sum /tmp/contentengine-pr205.tar.gz

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contentengine-pr205-tree
          path: /tmp/contentengine-pr205.tar.gz
          if-no-files-found: error
          retention-days: 1
