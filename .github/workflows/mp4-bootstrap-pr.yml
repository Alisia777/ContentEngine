name: Apply verified MP4 payload from PR

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: mp4-bootstrap-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Verify, unpack, test, and commit MP4 implementation
    if: >-
      github.event.pull_request.number == 205 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/generation-three-separate-forms-v2' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reassemble and verify exact payload
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: "205"
          EXPECTED_PARTS: "21"
          EXPECTED_ARCHIVE_SHA256: "b806bb80b108d6567ac24d2fed55e19853a6f7fc83a4b3a8031026e78ca959b7"
        run: |
          set -euo pipefail
          test -f .github/mp4-bootstrap-ready
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import re
          import tarfile
          import urllib.request
          from pathlib import Path

          repository = os.environ["REPOSITORY"]
          pr_number = int(os.environ["PR_NUMBER"])
          expected_parts = int(os.environ["EXPECTED_PARTS"])
          expected_sha = os.environ["EXPECTED_ARCHIVE_SHA256"]
          token = os.environ["GH_TOKEN"]
          root = Path.cwd().resolve()
          pattern = re.compile(
              r"^<!-- contentengine-mp4-bundle-v1 "
              r"part=(\d{3}) total=(\d{3}) chunk_sha256=([0-9a-f]{64})\n"
              r"([A-Za-z0-9+/=]+)\n-->$",
              re.DOTALL,
          )

          comments: list[dict[str, object]] = []
          for page in range(1, 20):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/issues/{pr_number}/comments"
                  f"?per_page=100&page={page}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "contentengine-mp4-bootstrap",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  batch = json.load(response)
              if not isinstance(batch, list):
                  raise SystemExit("GitHub comments response is not a list")
              comments.extend(batch)
              if len(batch) < 100:
                  break

          parts: dict[int, bytes] = {}
          for comment in comments:
              body = str(comment.get("body") or "").replace("\r\n", "\n").strip()
              match = pattern.fullmatch(body)
              if not match:
                  continue
              index = int(match.group(1))
              total = int(match.group(2))
              encoded = match.group(4)
              if total != expected_parts:
                  raise SystemExit(f"Part {index:03d} declares wrong total")
              if index in parts:
                  raise SystemExit(f"Duplicate part {index:03d}")
              padded = encoded + "=" * ((4 - len(encoded) % 4) % 4)
              parts[index] = base64.b64decode(padded, validate=True)

          expected = set(range(expected_parts))
          if set(parts) != expected:
              raise SystemExit(f"Payload parts incomplete: {sorted(expected - set(parts))}")
          archive = b"".join(parts[index] for index in range(expected_parts))
          archive_sha = hashlib.sha256(archive).hexdigest()
          if archive_sha != expected_sha:
              raise SystemExit(f"Archive SHA mismatch: {archive_sha} != {expected_sha}")

          archive_path = Path("/tmp/contentengine-mp4-payload.tar.gz")
          archive_path.write_bytes(archive)
          with tarfile.open(archive_path, "r:gz") as bundle:
              members = bundle.getmembers()
              for member in members:
                  if member.isdev() or member.issym() or member.islnk():
                      raise SystemExit(f"Unsafe archive member: {member.name}")
                  destination = (root / member.name).resolve()
                  if root != destination and root not in destination.parents:
                      raise SystemExit(f"Path traversal rejected: {member.name}")
              bundle.extractall(root)
          print(f"Verified and extracted {len(members)} files from {archive_sha}")
          PY

      - name: Validate extracted implementation
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          git diff --check
          python -m pytest -q tests/test_generation_intake_mp4_execution_v1.py -k 'not browser_route'
          find web/app -maxdepth 1 -type f -name 'generation-intake-mp4*.js' -print0 \
            | xargs -0 -r -n1 node --check
          node --check web/app/generation-strategy-intake-v2.js

      - name: Commit ordinary source files to the feature branch
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm -f \
            .github/mp4-bootstrap-ready \
            .github/workflows/mp4-bootstrap-apply.yml \
            .github/workflows/mp4-bootstrap-pr.yml \
            .github/workflows/export-pr-tree.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete MP4-first generation execution"
          git push origin "HEAD:${TARGET_BRANCH}"
