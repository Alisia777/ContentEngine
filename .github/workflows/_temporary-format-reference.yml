name: Temporary format Reference Intelligence

on:
  push:
    branches:
      - agent/reference-intelligence-v1

permissions:
  contents: write

concurrency:
  group: temporary-reference-format
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: agent/reference-intelligence-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.8.1

      - name: Format and commit only the new Edge Function
        shell: bash
        run: |
          set -euo pipefail
          deno fmt --line-width 120 supabase/functions/creator-reference-intelligence/index.ts
          if git diff --quiet -- supabase/functions/creator-reference-intelligence/index.ts; then
            echo "Reference Intelligence is already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/creator-reference-intelligence/index.ts
          git commit -m "Format Reference Intelligence Edge Function"
          git push origin HEAD:agent/reference-intelligence-v1
