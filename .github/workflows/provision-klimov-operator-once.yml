name: Provision Klimov operator once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/provision-klimov-operator-once.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: production-klimov-operator-onboarding
  cancel-in-progress: false

jobs:
  provision:
    name: Create account, waive training and send password link
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'Run protected Klimov onboarding v8'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      EXPECTED_SUPABASE_PROJECT_REF: iyckwryrucqrxwlowxow
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MEMBER_EMAIL: ${{ secrets.SUPABASE_MEMBER_KLIMOV_EMAIL }}
      MEMBER_DISPLAY_NAME: ${{ secrets.SUPABASE_MEMBER_KLIMOV_DISPLAY_NAME }}
      DISTINCT_FROM_ONE: ${{ secrets.SUPABASE_MEMBER_GUEST_EMAIL }}
      DISTINCT_FROM_TWO: ${{ secrets.SUPABASE_MEMBER_PAVLENKO_EMAIL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Announce protected operation start
        id: announce
        shell: bash
        run: |
          gh issue comment 121 --repo "$GITHUB_REPOSITORY" \
            --body "⏳ Защищённая production-операция запущена: создаю аккаунт без временного пароля, выдаю waiver без теста и отправляю ссылку для установки собственного пароля."

      - name: Check out reviewed main revision
        id: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Create or verify employee, waive final test and send password link
        id: onboard
        continue-on-error: true
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/contentengine-onboarding-safe.log"
          (
            set -euo pipefail
            : "${SUPABASE_ACCESS_TOKEN:?Configure SUPABASE_ACCESS_TOKEN in production}"
            : "${SUPABASE_PROJECT_REF:?Configure SUPABASE_PROJECT_REF as a repository variable}"
            : "${SUPABASE_PUBLISHABLE_KEY:?Configure SUPABASE_PUBLISHABLE_KEY as a repository variable}"
            : "${MEMBER_EMAIL:?Configure SUPABASE_MEMBER_KLIMOV_EMAIL in production}"
            : "${MEMBER_DISPLAY_NAME:?Configure SUPABASE_MEMBER_KLIMOV_DISPLAY_NAME in production}"
            : "${DISTINCT_FROM_ONE:?Configure SUPABASE_MEMBER_GUEST_EMAIL in production}"
            : "${DISTINCT_FROM_TWO:?Configure SUPABASE_MEMBER_PAVLENKO_EMAIL in production}"
            if [ "$SUPABASE_PROJECT_REF" != "$EXPECTED_SUPABASE_PROJECT_REF" ]; then
              echo "Production project binding mismatch" >&2
              exit 1
            fi
            echo "::add-mask::$MEMBER_EMAIL"
            echo "::add-mask::$MEMBER_DISPLAY_NAME"
            echo "::add-mask::$DISTINCT_FROM_ONE"
            echo "::add-mask::$DISTINCT_FROM_TWO"
            python -m scripts.provision_employee_without_training \
              --email="$MEMBER_EMAIL" \
              --display-name="$MEMBER_DISPLAY_NAME" \
              --distinct-from="$DISTINCT_FROM_ONE" \
              --distinct-from="$DISTINCT_FROM_TWO" \
              --reason="По решению владельца сотрудник допущен к рабочему кабинету без прохождения итогового теста."
          ) >"$log" 2>&1
          code=$?
          cat "$log"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Publish safe operation report
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          ONBOARD_OUTCOME: ${{ steps.onboard.outcome }}
          ONBOARD_EXIT_CODE: ${{ steps.onboard.outputs.exit_code }}
        shell: bash
        run: |
          if [ "$ONBOARD_OUTCOME" = "success" ] && [ "${ONBOARD_EXIT_CODE:-0}" = "0" ]; then
            gh issue comment 121 --repo "$GITHUB_REPOSITORY" \
              --body "✅ Production-проверка завершена: аккаунт создан или подтверждён, членство активно, роль **operator**, итоговый тест пропущен через аудируемый waiver, ссылка для установки пароля отправлена на защищённую почту сотрудника."
            exit 0
          fi

          log="$RUNNER_TEMP/contentengine-onboarding-safe.log"
          diagnostic=""
          if [ -f "$log" ]; then
            diagnostic="$(tail -n 16 "$log" | sed -E \
              -e 's/[A-Za-z0-9.!#$%&*+/?^_`{|}~-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,63}/[email]/g' \
              -e 's/sb_(secret|publishable)_[A-Za-z0-9._-]+/[supabase-key]/g' \
              -e 's/[A-Za-z0-9._-]{64,}/[redacted]/g')"
          fi
          if [ -z "$diagnostic" ]; then
            diagnostic="Нет безопасной прикладной диагностики: сбой произошёл до шага onboarding."
          fi
          gh issue comment 121 --repo "$GITHUB_REPOSITORY" \
            --body "❌ Production-onboarding остановлен fail-closed. Аккаунт не считаем готовым. Этапы: checkout=**$CHECKOUT_OUTCOME**, python=**$PYTHON_OUTCOME**, onboarding=**$ONBOARD_OUTCOME**, exit=**${ONBOARD_EXIT_CODE:-нет}**.\n\nБезопасная диагностика:\n\n\`\`\`text\n$diagnostic\n\`\`\`"

      - name: Fail closed when onboarding is not confirmed
        if: always() && steps.onboard.outcome != 'success'
        shell: bash
        run: exit 1
