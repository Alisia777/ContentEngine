name: Provision Klimov operator once

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: production-klimov-operator-onboarding
  cancel-in-progress: false

jobs:
  provision:
    name: Create account, waive training and send password link
    if: >-
      github.event.issue.number == 121 &&
      github.event.comment.body == '/provision-klimov-no-test' &&
      github.event.comment.user.login == 'Alisia777'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      EXPECTED_SUPABASE_PROJECT_REF: iyckwryrucqrxwlowxow
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MEMBER_EMAIL: ${{ secrets.SUPABASE_MEMBER_KLIMOV_EMAIL }}
      MEMBER_DISPLAY_NAME: ${{ secrets.SUPABASE_MEMBER_KLIMOV_DISPLAY_NAME }}
      MEMBER_TEMP_PASSWORD: ${{ secrets.SUPABASE_MEMBER_KLIMOV_TEMP_PASSWORD }}
      DISTINCT_FROM_ONE: ${{ secrets.SUPABASE_MEMBER_GUEST_EMAIL }}
      DISTINCT_FROM_TWO: ${{ secrets.SUPABASE_MEMBER_PAVLENKO_EMAIL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out reviewed main revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Create or verify employee, waive final test and send password link
        id: onboard
        env:
          CONTENTENGINE_MEMBER_DISPATCH_PASSWORD: ${{ secrets.SUPABASE_MEMBER_KLIMOV_TEMP_PASSWORD }}
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/contentengine-onboarding-safe.log"
          {
            set -euo pipefail
            : "${SUPABASE_ACCESS_TOKEN:?Configure SUPABASE_ACCESS_TOKEN in production}"
            : "${SUPABASE_PROJECT_REF:?Configure SUPABASE_PROJECT_REF as a repository variable}"
            : "${SUPABASE_PUBLISHABLE_KEY:?Configure SUPABASE_PUBLISHABLE_KEY as a repository variable}"
            : "${MEMBER_EMAIL:?Configure SUPABASE_MEMBER_KLIMOV_EMAIL in production}"
            : "${MEMBER_DISPLAY_NAME:?Configure SUPABASE_MEMBER_KLIMOV_DISPLAY_NAME in production}"
            : "${MEMBER_TEMP_PASSWORD:?Configure SUPABASE_MEMBER_KLIMOV_TEMP_PASSWORD in production}"
            : "${DISTINCT_FROM_ONE:?Configure SUPABASE_MEMBER_GUEST_EMAIL in production}"
            : "${DISTINCT_FROM_TWO:?Configure SUPABASE_MEMBER_PAVLENKO_EMAIL in production}"
            if [ "$SUPABASE_PROJECT_REF" != "$EXPECTED_SUPABASE_PROJECT_REF" ]; then
              echo "Production project binding mismatch" >&2
              exit 1
            fi
            echo "::add-mask::$MEMBER_EMAIL"
            echo "::add-mask::$MEMBER_DISPLAY_NAME"
            echo "::add-mask::$MEMBER_TEMP_PASSWORD"
            echo "::add-mask::$DISTINCT_FROM_ONE"
            echo "::add-mask::$DISTINCT_FROM_TWO"
            python -m scripts.provision_employee_without_training \
              --email="$MEMBER_EMAIL" \
              --display-name="$MEMBER_DISPLAY_NAME" \
              --account-slot=klimov \
              --password-dispatch-id="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:klimov:no-test-v3" \
              --distinct-from="$DISTINCT_FROM_ONE" \
              --distinct-from="$DISTINCT_FROM_TWO" \
              --reason="По решению владельца сотрудник допущен к рабочему кабинету без прохождения итогового теста."
          } >"$log" 2>&1
          code=$?
          cat "$log"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Report successful onboarding
        if: success()
        shell: bash
        run: |
          gh issue comment 121 --repo "$GITHUB_REPOSITORY" \
            --body "✅ Production-проверка завершена: защищённый account slot создан или подтверждён, членство активно, роль **operator**, итоговый тест пропущен через аудируемый waiver, письмо для установки пароля запрошено."

      - name: Report failed onboarding
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/contentengine-onboarding-safe.log"
          diagnostic=""
          if [ -f "$log" ]; then
            diagnostic="$(grep -E 'stopped:|required|mismatch|invalid|unavailable|does not exist|not active|unexpected' "$log" | tail -n 4 || true)"
          fi
          if [ -z "$diagnostic" ]; then
            diagnostic="Защищённая операция завершилась с ошибкой до формирования безопасной диагностики."
          fi
          gh issue comment 121 --repo "$GITHUB_REPOSITORY" \
            --body "❌ Production-onboarding остановлен fail-closed. Аккаунт не считаем готовым. Безопасная диагностика:\n\n\`\`\`text\n$diagnostic\n\`\`\`"
