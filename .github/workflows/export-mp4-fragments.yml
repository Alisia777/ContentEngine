name: Export MP4 payload fragments

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  export:
    if: >-
      github.event.pull_request.number == 205 &&
      github.event.pull_request.head.ref == 'agent/generation-three-separate-forms-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Export exact comment bodies
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          comments = []
          for page in range(1, 20):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/issues/205/comments?per_page=100&page={page}',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'contentengine-fragment-export',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  batch = json.load(response)
              comments.extend(batch)
              if len(batch) < 100:
                  break
          pattern = re.compile(
              r'^<!-- contentengine-mp4-bundle-v1 part=(\d{3}) total=(\d{3}) '
              r'chunk_sha256=([0-9a-f]{64})\n([A-Za-z0-9+/=]+)\n-->$',
              re.DOTALL,
          )
          out = Path('/tmp/mp4-fragments')
          out.mkdir(parents=True, exist_ok=True)
          manifest = []
          for comment in comments:
              body = str(comment.get('body') or '').replace('\r\n', '\n').strip()
              match = pattern.fullmatch(body)
              if not match:
                  continue
              index = int(match.group(1))
              encoded = match.group(4)
              (out / f'part-{index:03d}.b64').write_text(encoded, encoding='ascii')
              manifest.append({
                  'index': index,
                  'total': int(match.group(2)),
                  'declared_sha256': match.group(3),
                  'length': len(encoded),
                  'comment_id': comment.get('id'),
              })
          (out / 'manifest.json').write_text(
              json.dumps(sorted(manifest, key=lambda item: item['index']), indent=2),
              encoding='utf-8',
          )
          print(json.dumps(manifest[-5:], indent=2))
          PY

      - name: Upload exact fragments
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mp4-payload-fragments
          path: /tmp/mp4-fragments
          if-no-files-found: error
          retention-days: 1
