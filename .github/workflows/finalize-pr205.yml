name: Finalize PR205 production merge

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: finalize-pr205
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 205 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/generation-three-separate-forms-v2' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify ordinary source tree and one generation authority
        shell: bash
        run: |
          set -euo pipefail
          test -f web/app/generation-intake-mp4-v1.js
          test -f web/app/generation-strategy-intake-v3.js
          test -f tests/test_generation_intake_mp4_execution_v1.py
          test -f tests/test_generation_strategy_intake_v2.py
          test -f supabase/functions/creator-generate/index.ts
          test ! -e .github/mp4-bootstrap-ready
          test ! -e .github/workflows/mp4-bootstrap-apply.yml
          test ! -e .github/workflows/mp4-bootstrap-pr.yml
          test ! -e .github/workflows/export-pr-tree.yml
          test ! -e .github/workflows/export-mp4-fragments.yml
          test ! -d supabase/functions/contentengine-generation-intake
          ! grep -R --line-number --fixed-strings 'generation_intake_spend_ledger' supabase web tests
          ! grep -R --line-number --fixed-strings 'contentengine-generation-intake' web/app supabase/config.toml
          grep -q 'creator-generate' web/app/generation-intake-mp4-v1.js
          grep -q 'viral_product_swap' web/app/generation-intake-mp4-v1.js
          grep -q 'source_media_id' web/app/generation-intake-mp4-v1.js
          grep -q 'product_media_ids' web/app/generation-intake-mp4-v1.js
          grep -q 'source_url' web/app/generation-intake-mp4-v1.js
          grep -q '10' web/app/generation-strategy-intake-v3.js
          git diff --check origin/main...HEAD

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run focused production contracts
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_generation_strategy_intake_v2.py \
            tests/test_generation_intake_mp4_execution_v1.py \
            tests/test_generation_strategy_app_integration_v1.py \
            tests/test_generation_strategy_execution_v1.py
          node --check web/app/generation-strategy-intake-contract-v2.js
          node --check web/app/generation-strategy-intake-v2.js
          node --check web/app/generation-strategy-intake-v3.js
          node --check web/app/generation-intake-mp4-v1.js

      - name: Run workflow syntax validation
        run: python -c "import pathlib,yaml; [yaml.safe_load(p.read_text(encoding='utf-8')) for p in pathlib.Path('.github/workflows').glob('*.yml')]"

      - name: Remove one-shot finalizer and push exact head
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-pr205.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-shot PR205 finalizer'
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Mark ready and enable guarded merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr ready "$PR_NUMBER" --repo "$REPOSITORY" || true
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --auto --match-head-commit "$FINAL_HEAD"
