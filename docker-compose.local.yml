services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    environment:
      QVF_RUNTIME_PROFILE: development
      QVF_GENERATION_MODE: mock
      QVF_LLM_PROVIDER: mock
      QVF_VIDEO_PROVIDER: mock
      QVF_ALLOW_REAL_SPEND: "false"
      QVF_MOCK_PROVIDER_ENABLED: "true"
      QVF_DATABASE_URL: sqlite:////app/.local-data/qharisma.db
      QVF_MEDIA_ROOT: /app/media
      QVF_FFMPEG_PATH: ffmpeg
      QVF_FFPROBE_PATH: ffprobe
    volumes:
      - ./.local/docker/media:/app/media
      - ./.local/docker/data:/app/.local-data

  product-ugc-worker:
    build:
      context: .
      dockerfile: Dockerfile.local
    environment:
      QVF_RUNTIME_PROFILE: development
      QVF_GENERATION_MODE: mock
      QVF_LLM_PROVIDER: mock
      QVF_VIDEO_PROVIDER: mock
      QVF_ALLOW_REAL_SPEND: "false"
      QVF_MOCK_PROVIDER_ENABLED: "true"
      QVF_DATABASE_URL: sqlite:////app/.local-data/qharisma.db
      QVF_MEDIA_ROOT: /app/media
      QVF_FFMPEG_PATH: ffmpeg
      QVF_FFPROBE_PATH: ffprobe
    volumes:
      - ./.local/docker/media:/app/media
      - ./.local/docker/data:/app/.local-data

  # 8767 — РАБОЧИЙ портал оператора. Раздаётся сборка .local/prod-portal-site,
  # которая смотрит в боевой Supabase. Её НЕ переписывает write_local_site(),
  # и это главное: раньше здесь лежала .local/site, а dev-up затирал её
  # песочницей — оператор открывал знакомый адрес и видел пустой портал с
  # тестовой учёткой. Адрес 8767 при этом остаётся тем же, потому что он
  # прописан как разрешённый redirect в настройках авторизации.
  local-web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8767:80"
    restart: unless-stopped
    volumes:
      - ./.local/prod-portal-site:/usr/share/nginx/html:ro
      - ./dev/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro

  # 8768 — ПЕСОЧНИЦА для разработки: сборка .local/site смотрит в локальный
  # Supabase, платная генерация в ней выключена флагом mock-only. Её
  # пересобирает write_local_site() на каждом dev-up — и теперь это никому не
  # мешает, потому что рабочий портал живёт отдельно.
  sandbox-web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8768:80"
    restart: unless-stopped
    volumes:
      - ./.local/site:/usr/share/nginx/html:ro
      - ./dev/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro

  # Provider-free воркер подготовки видео (ТЗ 3.8-3.9): анализ MP4 и чистый
  # мастер вне браузера и вне edge. Ключ service-роли добавляет владелец в
  # .env (SUPABASE_SERVICE_ROLE_KEY) - в репозитории его нет и не будет.
  media-preparation-worker:
    build:
      context: .
      dockerfile: Dockerfile.local
    command:
      - python
      - scripts/media_preparation_worker.py
    restart: unless-stopped
    environment:
      SUPABASE_URL: "https://iyckwryrucqrxwlowxow.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      MEDIA_WORKER_POLL_SECONDS: "3"
      QVF_FFMPEG_PATH: ffmpeg
      QVF_FFPROBE_PATH: ffprobe
      # Опциональный ключ fal для платного голоса MiniMax в финализации;
      # пустой = маршрут выключен, работает бесплатный edge-tts.
      FAL_KEY: "${FAL_KEY:-}"
      # Dead-man-switch healthchecks.io; пустой = пинг выключен (no-op).
      HEALTHCHECKS_MEDIA_WORKER_URL: "${HEALTHCHECKS_MEDIA_WORKER_URL:-}"
    volumes:
      - .:/app
