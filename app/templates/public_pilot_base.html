<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title or "Контент ИИ Завод" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/portal_ui/portal_ui.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/public_pilot/public_pilot.css') }}">
  </head>
  <body class="portal-body public-pilot-body">
    <div class="portal-bg" aria-hidden="true">
      <div class="portal-bg__vignette"></div>
      <div class="portal-bg__ribbon portal-bg__ribbon--left"></div>
      <div class="portal-bg__ribbon portal-bg__ribbon--right"></div>
      <div class="portal-bg__spark portal-bg__spark--one"></div>
      <div class="portal-bg__spark portal-bg__spark--two"></div>
    </div>
    <main class="public-pilot-shell">
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', path='/public_pilot/product_telemetry.js') }}" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
