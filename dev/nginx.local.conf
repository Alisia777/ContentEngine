server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Local overlays are regenerated in place. Never let a previous config.js,
    # CSP, or application bundle survive a normal browser refresh.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
