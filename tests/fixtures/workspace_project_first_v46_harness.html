  <body>
    <div id="app" class="app-root">
      <div class="workspace-shell" data-workspace-section="home" data-workspace-authorized-routes="/workspace/research /workspace/team /workspace/feedback" data-workspace-role="owner">
        <script id="workspace-project-flow-snapshot" type="application/json">{"project_id":"11111111-1111-4111-8111-111111111111","project":{"id":"11111111-1111-4111-8111-111111111111","name":"Bombbar · Август"},"projects":[{"id":"11111111-1111-4111-8111-111111111111","name":"Bombbar · Август","current_stage":"review","next_action":{"label":"Принять решение","route":"/workspace/review?view=current&review=33333333-3333-4333-8333-333333333333"},"counts":{"files":18},"updated_at":"2026-08-04T07:30:00Z"},{"id":"22222222-2222-4222-8222-222222222222","name":"Milio · Новинки","current_stage":"files","next_action":{"label":"Добавить исходник","route":"/workspace/board"},"counts":{"files":7},"updated_at":"2026-08-04T07:20:00Z"}],"stages":[{"code":"files","state":"done","label":"Файлы"},{"code":"generation","state":"done","label":"Создать"},{"code":"review","state":"current","label":"Проверить"},{"code":"placement","state":"too_early","label":"Опубликовать","reason":"Сначала примите решение по проверке"},{"code":"stats","state":"too_early","label":"Результат","reason":"Метрики появятся после публикации"}],"next_action":{"label":"Принять решение","route":"/workspace/review?view=current&review=33333333-3333-4333-8333-333333333333","entity_type":"review","entity_id":"33333333-3333-4333-8333-333333333333"},"unread_count":2,"counts":{"files":18,"reviews":1,"placements":0,"notifications_unread":2}}</script>
        <aside class="sidebar"><nav class="workspace-nav"><a href="#/workspace/team">Команда</a><a href="#/workspace/research">Исследования</a></nav></aside>
        <section class="workspace-main">
          <main id="main-content" tabindex="-1"><div id="workspace-content"></div></main>
        </section>
      </div>
    </div>
    <output id="runtime-qa" hidden></output>
    <script>
      window.CONTENTENGINE_DESKTOP_V4 = true;
      sessionStorage.setItem("contentengine.desktop-v4.project", JSON.stringify({ id: "11111111-1111-4111-8111-111111111111", name: "Bombbar · Август" }));
      if (!location.hash.startsWith("#/workspace/")) location.hash = "#/workspace/home";

      const content = document.querySelector("#workspace-content");
      const shell = document.querySelector(".workspace-shell");
      const findings = Array.from({ length: 13 }, (_, index) => `
        <article class="content-review-finding is-${index < 2 ? "high" : index < 7 ? "medium" : "low"}">
          <strong>${index + 1}. ${index < 2 ? "Риск обещания без доказательства" : "Уточните формулировку и кадр"}</strong>
          <p>Короткое объяснение замечания ${index + 1}; исправьте только этот пункт.</p>
        </article>`).join("");

      function homeMarkup() {
        return `<div class="page-wrap workspace-home ce-v4-page">
          <section class="home-project-switcher" data-ce-v4-project-home>
            <header class="home-project-switcher__head">
              <div><p class="eyebrow">Рабочие столы</p><h1>Выберите проект</h1><p>Один проект хранит свои файлы и проходит понятный путь: создать → проверить → опубликовать → увидеть результат.</p></div>
              <details class="home-project-create"><summary><span>＋</span> Новый проект</summary><form id="home-project-create-form"><label>Название проекта</label><div><input placeholder="Например: Bombbar · Август" /><button class="btn" type="button" data-primary-action="true">Создать и открыть</button></div><small>Внутри проекта можно создавать папки.</small></form></details>
            </header>
            <div class="home-project-grid">
              <a class="home-project-card" href="#/workspace/review?view=current&amp;review=33333333-3333-4333-8333-333333333333&amp;project_id=11111111-1111-4111-8111-111111111111" data-ce-v4-project-id="11111111-1111-4111-8111-111111111111" data-ce-v4-project-name="Bombbar · Август"><span class="home-project-card__folder">◇</span><span class="home-project-card__copy"><strong>Bombbar · Август</strong><small>18 объектов · этап: Проверка</small><small>Следующее: принять решение</small><small>Обновлено 5 минут назад</small></span><span class="home-project-card__open">Продолжить →</span></a>
              <a class="home-project-card" href="#/workspace/board?project_id=22222222-2222-4222-8222-222222222222" data-ce-v4-project-id="22222222-2222-4222-8222-222222222222" data-ce-v4-project-name="Milio · Новинки"><span class="home-project-card__folder">◇</span><span class="home-project-card__copy"><strong>Milio · Новинки</strong><small>7 объектов · этап: Файлы</small><small>Следующее: добавить исходник</small><small>Обновлено 15 минут назад</small></span><span class="home-project-card__open">Продолжить →</span></a>
            </div>
            <aside class="home-next-action-compact"><span><small>Следующее действие</small><strong>Принять решение по ролику</strong></span><p>Открывается одна точная проверка выбранного проекта.</p><a class="btn btn-secondary" href="#/workspace/review?view=current&amp;review=33333333-3333-4333-8333-333333333333&amp;project_id=11111111-1111-4111-8111-111111111111">Открыть проверку →</a></aside>
          </section>
        </div>`;
      }

      function boardMarkup() {
        const cards = ["Фото упаковки", "Главное видео", "Сценарий", "Задача QA", "Публикация"].map((title, index) => `<article class="workspace-board__item" data-workspace-item-key="item-${index}" data-entity-type="${index === 3 ? "task" : "media"}" data-entity-id="item-${index}"><button class="workspace-board__item-open" type="button" data-action="open-workspace-item"><span class="workspace-board__item-preview">${index === 1 ? "▶" : "▧"}</span><span class="workspace-board__item-copy"><small>${index === 3 ? "Задача" : "Материал"}</small><strong>${title}</strong><span>Готово</span></span><span class="workspace-board__status">Готово</span></button><button class="workspace-board__context-trigger workspace-board__context-trigger--item" data-ce-v4-context-trigger="item" type="button">⋯</button></article>`).join("");
        return `<div class="page-wrap page-wrap-workspace-board ce-v4-page"><section class="workspace-board"><div class="workspace-board__layout">
          <aside class="workspace-board__sidebar"><div class="workspace-board__sidebar-head"><p>Проекты и папки</p><small>Корневая папка — проект</small></div><nav class="workspace-board__folders"><ul class="workspace-board__folder-list"><li class="workspace-board__folder-group-label">Проекты и папки</li><li class="workspace-board__folder-row is-selected" data-folder-id="project-bombbar" style="--workspace-folder-depth:0"><button class="workspace-board__folder-button" type="button"><span>◇</span><span>Bombbar · Август</span><small>18</small></button><button class="workspace-board__context-trigger" data-ce-v4-context-trigger="folder" type="button">⋯</button></li><li class="workspace-board__folder-row" data-folder-id="folder-sources" style="--workspace-folder-depth:1"><button class="workspace-board__folder-button" type="button"><span>◇</span><span>Исходники</span><small>5</small></button></li></ul></nav><div class="workspace-board__folder-management"><form id="workspace-folder-create-form" class="workspace-board__compact-form"><label>Новая папка</label><div><input name="folder_name" placeholder="Внутри проекта" /><button type="button">+</button></div></form></div></aside>
          <section class="workspace-board__content"><form id="workspace-board-filter-form" class="workspace-board__filters"><label class="workspace-board__search"><span>Поиск</span><input name="query" type="search" placeholder="Найти проект, папку, SKU или файл" /></label><label><span>Тип</span><select><option>Все типы</option></select></label><button type="button">Показать</button><button type="button">Сбросить</button><p>Найдено: 5</p></form><div class="workspace-board__collection-head"><div><p>Открытая папка</p><h2>Bombbar · Август</h2></div></div><div class="workspace-board__grid">${cards}</div></section>
          <aside class="workspace-board__drawer workspace-board__drawer--empty"><span class="workspace-board__drawer-mark">◇</span><h2>Выберите файл</h2><p>Нажмите карточку один раз.</p></aside>
        </div></section></div>`;
      }

      function generationMarkup() {
        return `<div class="page-wrap ce-v4-page"><section class="generation-launch-card card"><p class="eyebrow">Создание</p><h2>Новый запуск</h2><form id="mock-batch-form" novalidate>
          <div id="generation-readiness" class="generation-readiness"><strong>Готовность запуска</strong></div>
          <label>Режим<select name="generation_mode" required><option value="mock">Без оплаты</option><option value="real">Реальный ролик</option></select></label>
          <label>Длительность<select name="duration_seconds"><option>10</option></select></label>
          <label>Артикул<input name="sku" value="BOMBBAR-001" required /></label>
          <label>Название товара<input name="product_name" value="Bombbar протеин" required /></label>
          <label>Категория<input name="product_category" value="Батончики" /></label>
          <label>Площадка<select name="platform" required><option>TikTok</option></select></label>
          <label>Куда вести<input name="destination_ref" value="Карточка товара" /></label>
          <label>Замысел<textarea name="brief" required>Показать упаковку, разлом и честный вкус без медицинских обещаний.</textarea></label>
          <fieldset><legend>Исходники</legend><label><input name="media_id" type="checkbox" value="photo-1" checked /> Главное фото товара</label><label><input name="primary_media_id" type="radio" value="photo-1" checked /> Использовать главным</label></fieldset>
          <button id="generation-submit" class="btn btn-block" type="submit">Создать один ролик</button>
        </form></section></div>`;
      }

      function reviewMarkup() {
        return `<div class="page-wrap content-review-page focus-queue ce-v4-page" data-focus-queue="review"><nav class="focus-queue__bar" aria-label="Фокус-очередь проверок"><span><strong>Одна проверка</strong><small>Сохраните одно решение — портал откроет публикацию этого же ролика</small></span><a class="btn btn-secondary btn-small" href="#/workspace/review?view=history">Очередь · 12</a></nav><article class="content-review-result" data-review-result-id="33333333-3333-4333-8333-333333333333">
          <header class="content-review-result__header card"><p class="eyebrow">Проверка завершена</p><h2>Bombbar · рекламный ролик</h2><p>Общий результат понятен без технического UUID.</p></header>
          <div class="content-review-score-grid"><section class="card content-review-quality"><strong>82/100</strong><span>Качество</span></section><section class="card content-review-compliance"><strong>Нужны правки</strong><span>Соответствие</span></section></div>
          <section class="card content-review-breakdown"><h3>Материал</h3><p>Точный ролик, упаковка и заявленный товар совпадают.</p></section>
          <section class="card content-review-strengths"><h3>Сильные стороны</h3><p>Товар виден, хук понятен, монтаж аккуратный.</p></section>
          <section class="card content-review-findings"><h3>13 замечаний</h3><div class="content-review-finding-list">${findings}</div></section>
          <section class="card content-review-recommendations"><h3>Что исправить</h3><p>Сначала два замечания высокого риска, затем повторная проверка.</p></section>
          <form class="content-review-decision-form card"><h3>Решение человека</h3><label>Комментарий<textarea>Исправить обещание и отправить снова.</textarea></label><div class="content-review-decision-actions"><button class="btn" type="button" data-primary-action="true">Сохранить решение</button><button class="btn btn-secondary" type="button">На доработку</button><button class="btn btn-ghost" type="button">Отклонить</button></div></form>
        </article></div>`;
      }

      function renderRoute() {
        const route = (`/${String(location.hash || "#/workspace/home").replace(/^#\/?/, "").split("?")[0]}`).replace(/\/+/g, "/");
        const section = route.split("/").filter(Boolean).at(-1) || "home";
        shell.dataset.workspaceSection = section;
        content.innerHTML = section === "home" ? homeMarkup() : section === "board" ? boardMarkup() : section === "generation" ? generationMarkup() : section === "review" ? reviewMarkup() : `<div class="page-wrap ce-v4-page"><section class="card"><h1>${section}</h1><p>Один следующий шаг.</p></section></div>`;
        window.ContentEngineDesktopV4?.syncRoute?.();
        window.ContentEngineDesktopV4?.requestMount?.();
      }
      renderRoute();
      window.addEventListener("hashchange", renderRoute, { capture: true });
      content.addEventListener("click", (event) => {
        const open = event.target.closest('[data-action="open-workspace-item"]');
        if (open) {
          const board = open.closest(".workspace-board");
          const card = open.closest(".workspace-board__item");
          const drawer = board?.querySelector(".workspace-board__drawer");
          const title = card?.querySelector(".workspace-board__item-copy strong")?.textContent || "Файл";
          if (drawer) {
            drawer.classList.remove("workspace-board__drawer--empty");
            drawer.dataset.workspaceItemDrawer = "true";
            drawer.replaceChildren();
            const header = document.createElement("header");
            header.className = "workspace-board__drawer-head";
            const heading = document.createElement("h2");
            heading.textContent = title;
            const close = document.createElement("button");
            close.type = "button";
            close.dataset.action = "close-workspace-item";
            close.textContent = "Закрыть";
            header.append(heading, close);
            const preview = document.createElement("div");
            preview.className = "workspace-board__drawer-preview";
            preview.textContent = "Предпросмотр файла";
            const description = document.createElement("p");
            description.className = "workspace-board__drawer-description";
            description.textContent = "Файл открыт в том же рабочем окне Finder.";
            drawer.append(header, preview, description);
            card.classList.add("is-selected");
            window.ContentEngineDesktopV4?.requestMount?.();
          }
          return;
        }
        if (event.target.closest('[data-action="close-workspace-item"]')) {
          const board = event.target.closest(".workspace-board");
          const drawer = board?.querySelector(".workspace-board__drawer");
          if (drawer) {
            drawer.className = "workspace-board__drawer workspace-board__drawer--empty";
            drawer.removeAttribute("data-workspace-item-drawer");
            drawer.innerHTML = `<span class="workspace-board__drawer-mark">◇</span><h2>Выберите файл</h2><p>Нажмите карточку один раз.</p>`;
            board.querySelectorAll(".workspace-board__item.is-selected").forEach((node) => node.classList.remove("is-selected"));
            window.ContentEngineDesktopV4?.requestMount?.();
          }
        }
      });
    </script>
    <script type="module">
      await import("../../web/app/workspace-os-v4.js?v=20260804.os4.16");
      await import("../../web/app/workspace-os-v4-context-trash.js");
      await import("../../web/app/workspace-os-v4-finder.js");
      await import("../../web/app/workspace-os-v4-generation-guided.js");
      await import("../../web/app/workspace-os-v4-review-guided.js");
      await window.ContentEngineDesktopV4.flush();
      const qa = document.querySelector("#runtime-qa");
      const record = () => {
        const page = document.querySelector(".ce-v4-page");
        const visibleGuided = [...document.querySelectorAll("[data-ce-v4-generation-panel], [data-ce-v4-review-result-panel]")].filter((node) => !node.hidden);
        qa.dataset.route = location.hash;
        qa.dataset.dockCount = String(document.querySelectorAll(".ce-v4-dock").length);
        qa.dataset.flowbarCount = String(document.querySelectorAll(".ce-v4-flowbar").length);
        qa.dataset.locationCount = String(document.querySelectorAll(".ce-v4-menubar__location").length);
        qa.dataset.pageWidth = String(Math.round(page?.getBoundingClientRect().width || 0));
        qa.dataset.viewportWidth = String(innerWidth);
        qa.dataset.visibleGuidedPanels = String(visibleGuided.length);
        qa.dataset.primaryCount = String(document.querySelectorAll('[data-primary-action="true"]:not([hidden])').length);
      };
      record();
      window.addEventListener("hashchange", () => requestAnimationFrame(() => requestAnimationFrame(record)));
      document.addEventListener("click", () => requestAnimationFrame(record));
      window.ContentEngineProjectFirstHarness = { record, renderRoute };
    </script>
  </body>
</html>
