        missing: target - current,
        score: Math.round(current / target * 100),
        next_action: `Добавить ещё ${target - current} проверяемых сигнала`,

      const categories = definitions.map(([product_category, label, readiness_score, readiness_status]) => ({

        label,
        readiness_score,
        readiness_status,

            is_quality_guarantee: false,
            score: 68,
            status: "developing_evidence",
            evidence_count: 27,
            source_count: 8,
            dimensions,
            evidence_hash: "b".repeat(64),
            as_of: "2026-08-04T09:42:00.000Z",
          },
          gaps: [
            { key: "competitor_observations", title: "Мало сравнений с конкурентами", description: "Нужны свежие примеры карточек и UGC из этой категории.", missing: 2, priority: "high", next_action: "Добавить два независимых наблюдения" },
            { key: "human_validation", title: "Нужна ещё одна проверка команды", description: "Одна карточка суждения пока не подтверждена человеком.", missing: 1, priority: "normal", next_action: "Решить карточку «хорошо / плохо»" },
          ],
          knowledge_sources: [
            { source_id: "40000000-0000-4000-8000-000000000001", source_kind: "link", source_url: "https://example.com/cosmetics", title: "Разбор карточек категории", status: "verified", provenance: "example.com · публичный материал", created_at: "2026-08-04T08:10:00.000Z" },

          ],
          teaching_cards: [
            { card_id: "30000000-0000-4000-8000-000000000001", card_version: 1, card_hash: "a".repeat(64), signal_key: "hook.demonstration_first", title: "Сначала показать товар в действии", context: "Для ухода важен понятный первый результат без медицинских обещаний.", explanation: "ИИ видит устойчивый сигнал в проверенных сценариях этой категории.", polarity: "good", status: "pending", evidence_count: 7 },

          activity: [
            { event_id: "e3", event_type: "policy_released", title: "Выпущена policy v4", description: "Подтверждён bounded-сигнал demonstration_first.", actor_name: "Анна", created_at: "2026-08-04T09:30:00.000Z", state_version: 12 },
            { event_id: "e2", event_type: "source_registered", title: "Добавлен файл знаний", description: "Паспорт категории Q3.xlsx поставлен на проверку.", actor_name: "Илья", created_at: "2026-08-04T09:05:00.000Z", state_version: 11 },

          effective_policy: {
            version: 4,

        capabilities: {
          can_add_link: true,
          can_upload_file: true,
          can_decide: true,
          can_view_history: true,
        },
      };

      const root = document.querySelector("#visual-harness");
      const render = () => {
        const query = new URLSearchParams(location.search);
        root.innerHTML = aiLearningControlRoomMarkup(
          normalizeAiLearningControlRoom(snapshot),
          { category: "cosmetics", view: query.get("view") || "overview" },
        );
      };
      root.addEventListener("click", (event) => {
        const control = event.target.closest('[data-action="select-ai-learning-view"]');
        if (!control) return;
        history.replaceState({}, "", `?view=${encodeURIComponent(control.dataset.view)}`);
        render();
      });
      render();
      document.documentElement.dataset.harnessReady = "true";
    </script>
  </body>
